module_name: custom_action_control
parameters:
  - group: Custom Action
    definitions:
      CUST_TOP_EN:
        description:
          short: Enable SEARCH_TOP controller
        type: boolean
        default: 1
        reboot_required: true
      CUST_TOP_VEL:
        description:
          short: SEARCH_TOP upward speed
        type: float
        unit: m/s
        min: 0.05
        max: 0.30
        default: 0.15
        decimal: 2
      CUST_TOP_DIST:
        description:
          short: Maximum SEARCH_TOP upward distance
        type: float
        unit: m
        min: 0.10
        max: 3.00
        default: 1.00
        decimal: 2
      CUST_TOP_TIME:
        description:
          short: Maximum SEARCH_TOP duration
        type: float
        unit: s
        min: 1.0
        max: 30.0
        default: 10.0
        decimal: 1
      CUST_TOP_GAP:
        description:
          short: Top found distance
          long: Filtered minimum upward distance that changes SEARCH_TOP into the slow TOP_APPROACH stage.
        type: float
        unit: m
        min: 0.05
        max: 0.50
        default: 0.10
        decimal: 3
      CUST_TOP_FILT:
        description:
          short: Top-distance filter factor
          long: Low-pass filter factor applied to the minimum of the four upward distances. A smaller value gives stronger smoothing.
        type: float
        min: 0.01
        max: 1.00
        default: 0.25
        decimal: 2
      CUST_TOP_HYST:
        description:
          short: Top-distance state hysteresis
          long: Extra distance required to leave TOP_APPROACH or CONTACT_VERIFY after entering it.
        type: float
        unit: m
        min: 0.00
        max: 0.10
        default: 0.02
        decimal: 3
      CUST_APP_VEL:
        description:
          short: TOP_APPROACH upward speed
        type: float
        unit: m/s
        min: 0.01
        max: 0.15
        default: 0.05
        decimal: 2
      CUST_VER_VEL:
        description:
          short: CONTACT_VERIFY upward speed
        type: float
        unit: m/s
        min: 0.005
        max: 0.05
        default: 0.02
        decimal: 3
      CUST_CNT_DIST:
        description:
          short: Contact verification entry distance
        type: float
        unit: m
        min: 0.01
        max: 0.10
        default: 0.04
        decimal: 3
      CUST_CNT_TIME:
        description:
          short: Stable contact confirmation time
        type: float
        unit: s
        min: 0.10
        max: 2.00
        default: 0.50
        decimal: 2
      CUST_CNT_NUM:
        description:
          short: Required close top sensors
          long: Number of upward sensors that must be inside CUST_CNT_DIST before contact verification starts.
        type: int32
        min: 1
        max: 4
        default: 3
      CUST_STAB_BND:
        description:
          short: Contact distance stability band
          long: During CONTACT_VERIFY the filtered minimum distance must remain inside this total range for the confirmation time.
        type: float
        unit: m
        min: 0.001
        max: 0.030
        default: 0.005
        decimal: 3
      CUST_PRS_ADD:
        description:
          short: Contact thrust offset
          long: Normalized collective-thrust offset added after stable contact. Motor torque authority is removed during pressure hold.
        type: float
        min: 0.00
        max: 0.15
        default: 0.05
        decimal: 3
      CUST_PRS_RAMP:
        description:
          short: Contact thrust ramp rate
        type: float
        unit: 1/s
        min: 0.005
        max: 0.20
        default: 0.05
        decimal: 3
      CUST_REL_RAMP:
        description:
          short: Contact pressure release rate
          long: Rate used to reduce the pressure offset from its current value to CUST_REL_HOLD before attitude balancing.
        type: float
        unit: 1/s
        min: 0.01
        max: 0.50
        default: 0.10
        decimal: 3
      CUST_REL_HOLD:
        description:
          short: Pre-detach contact thrust offset
          long: Small normalized collective-thrust offset retained while full attitude control and current-X/Y hold settle before descent.
        type: float
        min: 0.00
        max: 0.05
        default: 0.01
        decimal: 3
      CUST_REL_VEL:
        description:
          short: Initial detach downward speed
        type: float
        unit: m/s
        min: 0.02
        max: 0.30
        default: 0.15
        decimal: 2
      CUST_REL_GAP:
        description:
          short: Relative clearance before LAND
          long: LAND is requested after at least CUST_CNT_NUM upward distances increase by this amount from detach start, or local Z moves downward by this amount. Twice this value forces an immediate LAND request.
        type: float
        unit: m
        min: 0.10
        max: 0.50
        default: 0.10
        decimal: 2
      CUST_REL_TIME:
        description:
          short: Relative-clearance confirmation time
        type: float
        unit: s
        min: 0.10
        max: 2.00
        default: 0.10
        decimal: 2
      CUST_ATT_TIME:
        description:
          short: Pre-detach attitude confirmation time
          long: Time that contact, roll/pitch angle and roll/pitch rate must remain inside their limits before downward detachment starts.
        type: float
        unit: s
        min: 0.20
        max: 3.00
        default: 0.75
        decimal: 2
      CUST_BAL_ANG:
        description:
          short: Pre-detach roll/pitch angle limit
        type: float
        unit: deg
        min: 0.5
        max: 10.0
        default: 2.0
        decimal: 1
      CUST_BAL_RATE:
        description:
          short: Pre-detach roll/pitch rate limit
        type: float
        unit: deg/s
        min: 2.0
        max: 60.0
        default: 10.0
        decimal: 1
      CUST_SENS_TO:
        description:
          short: Top-distance data timeout
        type: float
        unit: s
        min: 0.10
        max: 2.00
        default: 0.50
        decimal: 2
      CUST_HO_TIME:
        description:
          short: Handover HOLD output timeout
          long: Used for non-LAND legacy handovers. Normal safe detach requests LAND directly and does not wait for this timeout.
        type: float
        unit: s
        min: 1.0
        max: 10.0
        default: 3.0
        decimal: 1
