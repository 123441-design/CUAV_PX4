module_name: custom_action_control
parameters:
  - group: Custom Action
    definitions:
      CUST_TOP_EN:
        description:
          short: Enable SEARCH_TOP controller
        type: boolean
        default: 1
        reboot_required: true
      CUST_CLOSE_EN:
        description:
          short: Allow close-range SEARCH_TOP start
          long: Test-only override. When disabled, SEARCH_TOP can start only when all four upward distances are greater than CUST_TOP_GAP plus CUST_TOP_HYST. Enabling this bypasses only the initial distance gate; all other sensor and contact checks remain active.
        type: boolean
        default: 0
      CUST_TOP_VEL:
        description:
          short: SEARCH_TOP upward speed
        type: float
        unit: m/s
        min: 0.05
        max: 0.30
        default: 0.15
        decimal: 2
      CUST_TOP_DIST:
        description:
          short: Maximum SEARCH_TOP upward distance
        type: float
        unit: m
        min: 0.10
        max: 3.00
        default: 1.00
        decimal: 2
      CUST_TOP_TIME:
        description:
          short: Maximum SEARCH_TOP duration
        type: float
        unit: s
        min: 1.0
        max: 30.0
        default: 10.0
        decimal: 1
      CUST_TOP_GAP:
        description:
          short: Top found distance
          long: Filtered minimum upward distance that changes SEARCH_TOP into the slow TOP_APPROACH stage.
        type: float
        unit: m
        min: 0.05
        max: 0.50
        default: 0.10
        decimal: 3
      CUST_TOP_FILT:
        description:
          short: Top-distance filter factor
          long: Low-pass filter factor applied to the minimum of the four upward distances. A smaller value gives stronger smoothing.
        type: float
        min: 0.01
        max: 1.00
        default: 0.25
        decimal: 2
      CUST_TOP_HYST:
        description:
          short: Top-distance state hysteresis
          long: Extra distance required to leave TOP_APPROACH or CONTACT_VERIFY after entering it.
        type: float
        unit: m
        min: 0.00
        max: 0.10
        default: 0.02
        decimal: 3
      CUST_APP_VEL:
        description:
          short: TOP_APPROACH upward speed
        type: float
        unit: m/s
        min: 0.01
        max: 0.15
        default: 0.05
        decimal: 2
      CUST_VER_VEL:
        description:
          short: CONTACT_VERIFY upward speed
        type: float
        unit: m/s
        min: 0.005
        max: 0.05
        default: 0.02
        decimal: 3
      CUST_CNT_DIST:
        description:
          short: Contact verification entry distance
        type: float
        unit: m
        min: 0.01
        max: 0.10
        default: 0.04
        decimal: 3
      CUST_CNT_TIME:
        description:
          short: Stable contact confirmation time
        type: float
        unit: s
        min: 0.10
        max: 2.00
        default: 0.50
        decimal: 2
      CUST_STAB_BND:
        description:
          short: Contact distance stability band
          long: During CONTACT_VERIFY the filtered minimum distance must remain inside this total range for the confirmation time.
        type: float
        unit: m
        min: 0.001
        max: 0.030
        default: 0.005
        decimal: 3
      CUST_TRIM_RATIO:
        description:
          short: Motor trim capture time ratio
          long: Fraction of each stage's estimated available travel time used to collect motor trim samples. The result is constrained by CUST_TRIM_TMIN and CUST_TRIM_TMAX.
        type: float
        min: 0.01
        max: 1.00
        default: 0.20
        decimal: 2
      CUST_TRIM_TMIN:
        description:
          short: Minimum motor trim capture time
          long: Lower bound for the dynamically calculated motor trim capture time.
        type: float
        unit: s
        min: 0.05
        max: 2.00
        default: 0.25
        decimal: 2
      CUST_TRIM_TMAX:
        description:
          short: Maximum motor trim capture time
          long: Upper bound for the dynamically calculated motor trim capture time and the bounded wait before a safe downward retreat.
        type: float
        unit: s
        min: 0.10
        max: 3.00
        default: 0.80
        decimal: 2
      CUST_TRIM_ANG:
        description:
          short: Motor trim attitude limit
          long: Maximum absolute roll or pitch angle allowed while collecting per-motor trim samples.
        type: float
        unit: deg
        min: 1.0
        max: 15.0
        default: 3.0
        decimal: 1
      CUST_TRIM_RATE:
        description:
          short: Motor trim rate limit
          long: Maximum absolute roll or pitch angular rate allowed while collecting per-motor trim samples.
        type: float
        unit: deg/s
        min: 2.0
        max: 45.0
        default: 10.0
        decimal: 1
      CUST_PRS_GAIN:
        description:
          short: Pressure gain from contact output
          long: Each motor increases from its selected filtered trim by this common ratio. A value of 0.10 commands 1.10 times the aligned filtered baseline, subject to CUST_MOT_LIM. Individual motor outputs are not redistributed.
        type: float
        min: 0.00
        max: 0.50
        default: 0.30
        decimal: 3
      CUST_PRS_TIME:
        description:
          short: Contact pressure ramp time
          long: Time used to increase monotonically from the aligned filtered motor baseline to CUST_PRS_GAIN after the bounded direct-control blend. Reaching this time does not guarantee the target gain if CUST_MOT_LIM becomes active.
        type: float
        unit: s
        min: 0.20
        max: 10.00
        default: 3.00
        decimal: 2
      CUST_MOT_LIM:
        description:
          short: Direct motor output limit
          long: Common scaling stops when any filtered-baseline motor would exceed this normalized output, preserving the selected filtered motor ratios.
        type: float
        min: 0.50
        max: 1.00
        default: 0.95
        decimal: 2
      CUST_SENS_TO:
        description:
          short: Top-distance data timeout
        type: float
        unit: s
        min: 0.10
        max: 2.00
        default: 0.50
        decimal: 2
      CUST_HO_TIME:
        description:
          short: Handover HOLD output timeout
          long: After this timeout the handover remains blocked, but internal Offboard output stops so normal Offboard-loss can occur if V3 is absent.
        type: float
        unit: s
        min: 1.0
        max: 10.0
        default: 3.0
        decimal: 1
